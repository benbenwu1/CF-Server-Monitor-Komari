# Cloudflare Workers 配置，线上已由deploy.yml接管，这里仅供本地测试
name = "cf-server-monitor-komari"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

keep_vars = true

# 可选：只读轮询现有 Komari 公开 RPC，用于统一飞书异常与流量摘要。
# [vars]
# KOMARI_MONITOR_URL = "https://vps.i404.dev"
# FEISHU_APP_ID = "cli_xxx"
# FEISHU_RECEIVE_ID_TYPE = "union_id"
# FEISHU_APP_SECRET 与 FEISHU_RECEIVE_ID 必须使用 Worker Secret，不能写入本文件。

# 定时任务配置（UTC）
# - 每分钟：执行离线节点检测
# - 每小时：合并执行其他定时任务（每月1号数据清理、每月8号清理旧表、每天12点服务器到期检测）
# - 注意同步修改deploy和index.js scheduled函数里面的值
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cf-server-monitor-komari-db"
database_id = "fc52eab7-4134-4a12-bb2f-8777df48f89a"

# 可选：P2 Analytics Engine 影子遥测。未配置时不写入任何遥测数据。
# [[analytics_engine_datasets]]
# binding = "CFSM_ANALYTICS"
# dataset = "cfsm_shadow_telemetry"

# 可选：管理员手动把脱敏后的配置逻辑备份写入私有 R2。
# 未配置时下载备份仍可用，Worker 启动和其他功能不受影响。
# [[r2_buckets]]
# binding = "BACKUP_BUCKET"
# bucket_name = "your-private-backup-bucket"

# 可选：自动告警异步投递。先创建 Queue，再同时启用 producer 与 consumer。
# 未配置时离线、恢复、资源与到期告警保持原同步投递行为。
# npx wrangler queues create cf-server-monitor-komari-notifications
# [[queues.producers]]
# binding = "NOTIFICATION_QUEUE"
# queue = "cf-server-monitor-komari-notifications"
#
# [[queues.consumers]]
# queue = "cf-server-monitor-komari-notifications"
# max_batch_size = 5
# max_batch_timeout = 1
# max_retries = 3
# retry_delay = 60
# max_concurrency = 1

# Durable Objects：实时指标广播中心
# 注意：首次部署前需要执行 `wrangler durable-object create MetricsBroadcaster --class MetricsBroadcaster`
# 或者在部署后，wrangler 会自动创建对应的 DO namespace。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
