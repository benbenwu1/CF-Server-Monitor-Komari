name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - id: decide
        run: |
          if [ -n "$CF_ACCOUNT_ID" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build frontend assets
        run: npm run build:frontend

      - name: 📝 Create wrangler.toml
        env:
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          NOTIFICATION_QUEUE_NAME: ${{ vars.NOTIFICATION_QUEUE_NAME }}
          ANALYTICS_ENGINE_DATASET: ${{ vars.ANALYTICS_ENGINE_DATASET }}
        run: |
          cat > wrangler.toml << 'WEOF'
          name = "server-monitor-pro"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]

          # 定时任务配置（UTC）
          # - 每分钟：执行离线节点检测
          # - 每小时：合并执行其他定时任务（每月1号数据清理、每月8号清理旧表、每天12点服务器到期检测）
          [triggers]
          crons = ["*/1 * * * *", "0 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "D1_PLACEHOLDER"

          # Durable Objects：实时指标广播中心
          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]

          [vars]
          API_SECRET = "SECRET_PLACEHOLDER"
          API_USER_NAME = "USER_NAME_PLACEHOLDER"
          CORS_ALLOWED_ORIGINS = "CORS_ORIGINS_PLACEHOLDER"
          WEOF

          # 可选配置逻辑备份：仓库变量为空时完全不声明 R2 binding。
          if [ -n "$R2_BACKUP_BUCKET" ]; then
            if [[ ! "$R2_BACKUP_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
              echo "R2_BACKUP_BUCKET 必须是 3-63 位小写字母、数字或连字符" >&2
              exit 1
            fi
            cat >> wrangler.toml << WEOF

          [[r2_buckets]]
          binding = "BACKUP_BUCKET"
          bucket_name = "$R2_BACKUP_BUCKET"
          WEOF
          fi

          # 可选通知 Queue：需先在同一 Cloudflare 账户创建 Queue。
          if [ -n "$NOTIFICATION_QUEUE_NAME" ]; then
            if [[ ! "$NOTIFICATION_QUEUE_NAME" =~ ^[a-z0-9][a-z0-9_-]{0,62}$ ]]; then
              echo "NOTIFICATION_QUEUE_NAME 必须是 1-63 位小写字母、数字、下划线或连字符" >&2
              exit 1
            fi
            cat >> wrangler.toml << WEOF

          [[queues.producers]]
          binding = "NOTIFICATION_QUEUE"
          queue = "$NOTIFICATION_QUEUE_NAME"

          [[queues.consumers]]
          queue = "$NOTIFICATION_QUEUE_NAME"
          max_batch_size = 5
          max_batch_timeout = 1
          max_retries = 3
          retry_delay = 60
          max_concurrency = 1
          WEOF
          fi

          # 可选 Analytics Engine 影子遥测：变量为空时完全不声明 binding。
          if [ -n "$ANALYTICS_ENGINE_DATASET" ]; then
            if [[ ! "$ANALYTICS_ENGINE_DATASET" =~ ^[a-z][a-z0-9_]{0,63}$ ]]; then
              echo "ANALYTICS_ENGINE_DATASET 必须以小写字母开头，仅包含小写字母、数字或下划线，最长 64 位" >&2
              exit 1
            fi
            cat >> wrangler.toml << WEOF

          [[analytics_engine_datasets]]
          binding = "CFSM_ANALYTICS"
          dataset = "$ANALYTICS_ENGINE_DATASET"
          WEOF
          fi

          # 替换占位符
          sed -i "s|D1_PLACEHOLDER|${{ secrets.D1_DATABASE_ID }}|g" wrangler.toml
          sed -i "s|SECRET_PLACEHOLDER|${{ secrets.API_SECRET }}|g" wrangler.toml
          sed -i "s|USER_NAME_PLACEHOLDER|${{ secrets.API_USER_NAME }}|g" wrangler.toml
          sed -i "s|CORS_ORIGINS_PLACEHOLDER|${{ secrets.CORS_ALLOWED_ORIGINS }}|g" wrangler.toml

          echo "✅ wrangler.toml 已生成"

      # wrangler v4 的 `deploy` 会自动根据 wrangler.toml 中的 [[durable_objects.bindings]]
      # 声明创建 DO namespace（幂等：已存在则跳过），无需单独命令。
      # 前提：MetricsBroadcaster 类必须从 index.js 导出（已通过 src/index.js 实现）。
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "============================================"
          echo "  🎉 部署成功！"
          echo "============================================"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "============================================"
          echo "  💥 部署失败！请检查 Actions 日志"
          echo "============================================"
